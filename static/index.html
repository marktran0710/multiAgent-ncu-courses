<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCU Course Finder</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --bg: #f4f7fb;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --ink: #111827;
            --muted: #64748b;
            --line: #d8e0ea;
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --green: #059669;
            --amber: #b45309;
            --rose: #e11d48;
            --shadow: 0 18px 48px rgba(15, 23, 42, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app-shell {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            background: #0f172a;
            color: #f8fafc;
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #f8fafc;
            color: #0f172a;
            font-weight: 800;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.05rem;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .brand p {
            margin: 2px 0 0;
            color: #cbd5e1;
            font-size: 0.88rem;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            color: #dbeafe;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 99px;
            background: #22c55e;
        }

        .ghost-button {
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 8px;
            background: transparent;
            color: inherit;
            padding: 9px 12px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .ghost-button:hover {
            background: rgba(148, 163, 184, 0.14);
            border-color: rgba(148, 163, 184, 0.42);
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 18px;
            width: min(100%, 1280px);
            margin: 0 auto;
            padding: 18px;
        }

        .chat-panel,
        .side-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            min-width: 0;
        }

        .chat-panel {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: calc(100vh - 104px);
            overflow: hidden;
        }

        .chat-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--panel-soft);
        }

        .chat-title {
            min-width: 0;
        }

        .chat-title h2 {
            margin: 0;
            font-size: 1rem;
        }

        .chat-title p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .chat-window {
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            padding: 18px;
            background: #eef3f8;
        }

        .message {
            display: grid;
            gap: 6px;
            max-width: 78%;
            animation: messageIn 0.18s ease-out;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.bot,
        .message.system {
            align-self: flex-start;
        }

        .message-meta {
            color: var(--muted);
            font-size: 0.78rem;
            padding: 0 2px;
        }

        .message.user .message-meta {
            text-align: right;
        }

        .bubble {
            padding: 13px 14px;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border: 1px solid transparent;
        }

        .message.user .bubble {
            background: var(--blue);
            color: #ffffff;
        }

        .message.bot .bubble {
            background: #ffffff;
            border-color: var(--line);
        }

        .message.system .bubble {
            background: #fff7ed;
            color: #7c2d12;
            border-color: #fed7aa;
        }

        .typing {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-width: 54px;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 99px;
            background: #94a3b8;
            animation: typingPulse 1s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.12s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.24s;
        }

        .quick-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 16px 0;
            background: #ffffff;
        }

        .prompt-chip,
        .tag {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #ffffff;
            color: #334155;
            padding: 8px 10px;
            font-size: 0.9rem;
            transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
        }

        .prompt-chip:hover {
            border-color: #93c5fd;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .composer {
            border-top: 1px solid var(--line);
            background: #ffffff;
        }

        .composer-inner {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            padding: 12px 16px 16px;
            align-items: end;
        }

        .composer textarea {
            width: 100%;
            min-height: 48px;
            max-height: 132px;
            resize: none;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 13px 14px;
            outline: none;
            line-height: 1.45;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .composer textarea:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .send-button {
            min-width: 92px;
            min-height: 48px;
            border: none;
            border-radius: 8px;
            background: var(--blue);
            color: #ffffff;
            font-weight: 700;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .send-button:hover {
            background: var(--blue-dark);
            transform: translateY(-1px);
        }

        .send-button:disabled {
            cursor: not-allowed;
            background: #94a3b8;
            transform: none;
        }

        .composer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 0 16px 14px;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .side-panel {
            display: grid;
            grid-template-rows: auto auto 1fr;
            align-self: start;
            overflow: hidden;
        }

        .side-section {
            padding: 16px;
            border-bottom: 1px solid var(--line);
        }

        .side-section:last-child {
            border-bottom: none;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .section-heading h2,
        .section-heading h3 {
            margin: 0;
            font-size: 1rem;
        }

        .profile-meter {
            display: grid;
            gap: 8px;
        }

        .meter-track {
            width: 100%;
            height: 8px;
            overflow: hidden;
            background: #e2e8f0;
            border-radius: 99px;
        }

        .meter-fill {
            width: 0%;
            height: 100%;
            background: var(--green);
            transition: width 0.25s ease;
        }

        .meter-label {
            color: var(--muted);
            font-size: 0.88rem;
        }

        .profile-grid {
            display: grid;
            gap: 10px;
        }

        .profile-row {
            display: grid;
            gap: 5px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-soft);
        }

        .profile-label {
            color: #475569;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .profile-value {
            color: #172033;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            cursor: default;
            background: #f8fafc;
        }

        .empty-state {
            color: var(--muted);
            line-height: 1.6;
        }

        .activity-list {
            display: grid;
            gap: 10px;
        }

        .activity-item {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            align-items: start;
            color: #334155;
            line-height: 1.45;
            font-size: 0.92rem;
        }

        .activity-index {
            display: grid;
            place-items: center;
            width: 24px;
            height: 24px;
            border-radius: 8px;
            background: #e0f2fe;
            color: #075985;
            font-weight: 800;
            font-size: 0.78rem;
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 10;
            max-width: min(360px, calc(100vw - 36px));
            padding: 12px 14px;
            border-radius: 8px;
            background: #0f172a;
            color: #ffffff;
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes typingPulse {
            0%,
            80%,
            100% {
                opacity: 0.35;
                transform: translateY(0);
            }

            40% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        @media (max-width: 920px) {
            .workspace {
                grid-template-columns: 1fr;
            }

            .chat-panel {
                min-height: 70vh;
            }
        }

        @media (max-width: 640px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
                padding: 14px;
            }

            .topbar-actions {
                width: 100%;
                justify-content: space-between;
            }

            .workspace {
                padding: 10px;
                gap: 10px;
            }

            .chat-panel {
                min-height: calc(100vh - 156px);
            }

            .message {
                max-width: 92%;
            }

            .composer-inner {
                grid-template-columns: 1fr;
            }

            .send-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">NCU</div>
                <div>
                    <h1>Course Finder</h1>
                    <p>Personalized course recommendations</p>
                </div>
            </div>
            <div class="topbar-actions">
                <div class="status-pill"><span class="status-dot"></span><span id="connectionStatus">Ready</span></div>
                <button class="ghost-button" id="clearChatButton" type="button">Clear</button>
            </div>
        </header>

        <section class="workspace">
            <section class="chat-panel" aria-label="Course chat">
                <div class="chat-toolbar">
                    <div class="chat-title">
                        <h2>Recommendation Chat</h2>
                        <p id="chatSummary">No active recommendation yet.</p>
                    </div>
                </div>

                <div class="chat-window" id="chatContainer" aria-live="polite"></div>

                <div class="composer">
                    <div class="quick-prompts" id="quickPrompts"></div>
                    <div class="composer-inner">
                        <textarea id="messageInput" placeholder="Ask about courses..." autocomplete="off" rows="1"></textarea>
                        <button class="send-button" id="sendButton" type="button">Send</button>
                    </div>
                    <div class="composer-footer">
                        <span id="inputHint">Ready for a course request.</span>
                        <span id="characterCount">0 / 500</span>
                    </div>
                </div>
            </section>

            <aside class="side-panel" aria-label="Student profile">
                <section class="side-section">
                    <div class="section-heading">
                        <h2>Your Profile</h2>
                        <span class="tag" id="profileState">Empty</span>
                    </div>
                    <div class="profile-meter">
                        <div class="meter-track"><div class="meter-fill" id="profileMeter"></div></div>
                        <div class="meter-label" id="profileMeterLabel">0 of 5 profile signals captured</div>
                    </div>
                </section>

                <section class="side-section">
                    <div id="profileContent" class="profile-grid">
                        <div class="empty-state">No profile yet.</div>
                    </div>
                </section>

                <section class="side-section">
                    <div class="section-heading">
                        <h3>Session Notes</h3>
                    </div>
                    <div class="activity-list" id="activityList">
                        <div class="activity-item">
                            <div class="activity-index">1</div>
                            <div>Waiting for the first course request.</div>
                        </div>
                    </div>
                </section>
            </aside>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const input = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const quickPrompts = document.getElementById('quickPrompts');
        const characterCount = document.getElementById('characterCount');
        const connectionStatus = document.getElementById('connectionStatus');
        const profileState = document.getElementById('profileState');
        const profileMeter = document.getElementById('profileMeter');
        const profileMeterLabel = document.getElementById('profileMeterLabel');
        const activityList = document.getElementById('activityList');
        const chatSummary = document.getElementById('chatSummary');
        const toast = document.getElementById('toast');

        const maxChars = 500;
        const prompts = [
            'I want to learn machine learning',
            'I completed CSIE1001 and CSIE2001',
            'Recommend an English AI course',
            'I need a beginner programming course',
            'I prefer Tuesday or Thursday classes'
        ];
        const activity = [];
        let typingNode = null;
        let isSending = false;

        function init() {
            renderPrompts();
            addMessage('bot', "Welcome. Tell me what you want to learn, what you have completed, or when you are available.");
            bindEvents();
            loadProfile();
            updateComposer();
        }

        function bindEvents() {
            sendButton.addEventListener('click', sendMessage);
            document.getElementById('clearChatButton').addEventListener('click', clearChat);
            input.addEventListener('input', () => {
                autoResizeInput();
                updateComposer();
            });
            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            });
        }

        function renderPrompts() {
            quickPrompts.replaceChildren();
            prompts.forEach((prompt) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'prompt-chip';
                button.textContent = prompt;
                button.addEventListener('click', () => {
                    input.value = prompt;
                    autoResizeInput();
                    updateComposer();
                    input.focus();
                });
                quickPrompts.appendChild(button);
            });
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message || isSending) return;

            setSending(true);
            addMessage('user', message);
            addActivity(`Asked: ${message}`);
            input.value = '';
            autoResizeInput();
            updateComposer();
            showTyping();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                const data = await response.json();
                hideTyping();
                addMessage('bot', data.response || 'I could not generate a recommendation.');
                updateProfile(data.profile);
                addActivity('Recommendation updated.');
                chatSummary.textContent = data.profile ? profileSummary(data.profile) : 'No active profile yet.';
            } catch (error) {
                hideTyping();
                addMessage('system', 'The request could not be completed. Please try again.');
                showToast(error.message);
            } finally {
                setSending(false);
            }
        }

        function addMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const meta = document.createElement('div');
            meta.className = 'message-meta';
            meta.textContent = sender === 'user' ? 'You' : sender === 'bot' ? 'Course Finder' : 'System';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            messageDiv.append(meta, bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            hideTyping();
            typingNode = document.createElement('div');
            typingNode.className = 'message bot';

            const meta = document.createElement('div');
            meta.className = 'message-meta';
            meta.textContent = 'Course Finder';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const dots = document.createElement('div');
            dots.className = 'typing';
            dots.innerHTML = '<span></span><span></span><span></span>';
            bubble.appendChild(dots);

            typingNode.append(meta, bubble);
            chatContainer.appendChild(typingNode);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTyping() {
            if (typingNode) {
                typingNode.remove();
                typingNode = null;
            }
        }

        function updateProfile(profile) {
            const container = document.getElementById('profileContent');
            if (!profile) {
                profileState.textContent = 'Empty';
                profileMeter.style.width = '0%';
                profileMeterLabel.textContent = '0 of 5 profile signals captured';
                container.innerHTML = '<div class="empty-state">No profile yet.</div>';
                return;
            }

            const fields = [
                { label: 'Degree Level', value: titleCase(profile.degree_level || 'Not set') },
                { label: 'Academic Year', value: profile.academic_year || 'Not set' },
                { label: 'Language', value: profile.preferred_language || 'Not specified' },
                { label: 'Completed Courses', value: listValue(profile.completed_courses, 'None') },
                { label: 'Goals', value: listValue(profile.goals, 'Not specified') },
                { label: 'Constraints', value: listValue(profile.constraints, 'None') },
                { label: 'Search Query', value: profile.search_query || 'Not set' }
            ];

            container.replaceChildren(...fields.map(renderProfileRow));
            updateProfileMeter(profile);
        }

        function renderProfileRow(field) {
            const row = document.createElement('div');
            row.className = 'profile-row';

            const label = document.createElement('div');
            label.className = 'profile-label';
            label.textContent = field.label;

            const value = document.createElement('div');
            value.className = 'profile-value';
            value.textContent = field.value;

            row.append(label, value);
            return row;
        }

        function updateProfileMeter(profile) {
            const signals = [
                Boolean(profile.degree_level),
                Boolean(profile.academic_year),
                Boolean(profile.completed_courses && profile.completed_courses.length),
                Boolean(profile.goals && profile.goals.length),
                Boolean(profile.constraints && profile.constraints.length)
            ];
            const count = signals.filter(Boolean).length;
            const percent = Math.round((count / signals.length) * 100);
            profileMeter.style.width = `${percent}%`;
            profileMeterLabel.textContent = `${count} of ${signals.length} profile signals captured`;
            profileState.textContent = count >= 4 ? 'Strong' : count >= 2 ? 'Growing' : 'Started';
        }

        function addActivity(text) {
            activity.unshift(text);
            if (activity.length > 4) activity.pop();
            activityList.replaceChildren(...activity.map((item, index) => {
                const row = document.createElement('div');
                row.className = 'activity-item';

                const number = document.createElement('div');
                number.className = 'activity-index';
                number.textContent = String(index + 1);

                const content = document.createElement('div');
                content.textContent = item;

                row.append(number, content);
                return row;
            }));
        }

        async function loadProfile() {
            try {
                const response = await fetch('/profile');
                if (response.ok) {
                    const profile = await response.json();
                    updateProfile(profile);
                    chatSummary.textContent = profileSummary(profile);
                    addActivity('Loaded existing profile.');
                }
            } catch (error) {
                updateProfile(null);
            }
        }

        function clearChat() {
            chatContainer.replaceChildren();
            activity.length = 0;
            activityList.innerHTML = `
                <div class="activity-item">
                    <div class="activity-index">1</div>
                    <div>Chat view cleared.</div>
                </div>
            `;
            addMessage('bot', 'Fresh chat view.');
            showToast('Chat view cleared.');
        }

        function setSending(value) {
            isSending = value;
            sendButton.disabled = value || !input.value.trim();
            sendButton.textContent = value ? 'Sending' : 'Send';
            connectionStatus.textContent = value ? 'Thinking' : 'Ready';
        }

        function updateComposer() {
            const length = input.value.length;
            if (length > maxChars) {
                input.value = input.value.slice(0, maxChars);
            }
            characterCount.textContent = `${input.value.length} / ${maxChars}`;
            sendButton.disabled = isSending || !input.value.trim();
        }

        function autoResizeInput() {
            input.style.height = 'auto';
            input.style.height = `${Math.min(input.scrollHeight, 132)}px`;
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            window.setTimeout(() => toast.classList.remove('show'), 2600);
        }

        function profileSummary(profile) {
            const goals = profile.goals && profile.goals.length ? profile.goals.slice(0, 2).join(', ') : 'goals pending';
            const completed = profile.completed_courses && profile.completed_courses.length
                ? `${profile.completed_courses.length} completed`
                : 'no completed courses listed';
            return `${titleCase(profile.degree_level || 'student')} year ${profile.academic_year || '?'} · ${completed} · ${goals}`;
        }

        function listValue(items, fallback) {
            return items && items.length ? items.join(', ') : fallback;
        }

        function titleCase(value) {
            return String(value).replace(/\b\w/g, (letter) => letter.toUpperCase());
        }

        init();
    </script>
</body>

</html>
